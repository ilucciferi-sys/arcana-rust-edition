[workspace]
members = ["crates/arcana-core", "crates/horizon-vfx"]
resolver = "2"

[patch.crates-io]
wgpu-hal = { path = "../third_party/wgpu-hal" }

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }
bytemuck = { version = "1.24", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "metal", "wgsl"] }

[profile.dev]
debug = "line-tables-only"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
